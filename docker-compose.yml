services:
  # ── Reverse proxy + WAF ──────────────────────────────────────────────────────
  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - caddy_logs:/var/log/caddy
    networks:
      - chakula_net
    mem_limit: 512m
    cpus: 1.0

  # ── Secure Vision Realty ────────────────────────────────────────────────────
  secure_vision_backend:
    image: mosesmbadi/secure-vision-backend:latest
    container_name: secure_vision_backend
    restart: unless-stopped
    environment:
      - DATABASE_URL=sqlite:////app/db/realty.db
      - ADMIN_PASSWORD=${SECURE_VISION_ADMIN_PASSWORD}
      - CORS_ORIGINS=https://securevisionrealty.com,https://www.securevisionrealty.com
    expose:
      - "8000"
    volumes:
      - ./data/secure_vision/db:/app/db
      - ./data/secure_vision/uploads:/app/uploads
    networks:
      - chakula_net
    mem_limit: 512m
    cpus: 1.0

  secure_vision_frontend:
    image: mosesmbadi/secure-vision-frontend:latest
    container_name: secure_vision_frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - chakula_net
    mem_limit: 128m
    cpus: 0.5

  # ── More Services Will Go here ────────────────────────────────────────────────────

networks:
  chakula_net:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  caddy_logs:
